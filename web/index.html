<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><meta name="apple-mobile-web-app-capable" content="yes"><title>Flight Tracker · 雲端機票追蹤</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><header><div class="brand">✈︎ <b>Flight Tracker</b><span>2.0</span></div><nav><button id="export" class="secondary">匯出備份</button><button id="import" class="secondary">匯入備份</button><input id="importfile" type="file" accept="application/json,.json" hidden></nav></header><main><section id="dashboard" hidden><div class="hero"><div><div class="eyebrow">YOUR TRAVEL WATCHLIST</div><h1>每一趟旅程，<br>都有值得等待的價格。</h1><p id="summary">管理所有機票監控與最新變動</p></div><button id="add">＋ 新增航線</button></div><div id="cloudPanel" class="notice" hidden><strong>雲端監控</strong><div id="cloudLoggedOut"><form id="cloudLogin" class="cloud-login"><input type="email" name="email" placeholder="Email" autocomplete="email" required><input type="password" name="password" placeholder="密碼" autocomplete="current-password" minlength="6" required><button type="submit" name="mode" value="signin">登入</button><button type="submit" name="mode" value="signup" class="secondary">註冊</button></form></div><div id="cloudLoggedIn" hidden><button id="cloudSync" class="secondary">同步價格</button><button id="pushEnable" class="secondary">啟用手機通知</button><button id="cloudLogout" class="secondary">登出</button></div><p id="cloudStatus" role="status">尚未登入</p></div><div id="localBanner" class="notice"><strong>尚未設定雲端</strong>：目前僅儲存在此瀏覽器，沒有自動查價或推播。部署時請設定 web/cloud-config.js 並執行資料庫 SQL。</div><div id="message" role="status"></div><div class="sectionhead"><h2>追蹤中的航線</h2><span id="count"></span></div><div id="monitors" class="cards"></div><div class="sectionhead"><h2>價格通知</h2></div><div id="alerts" class="alerts"><div class="alert">票價歷史會在設定雲端並完成第一次有效抓價後出現。</div></div></section><dialog id="editor"><form id="monitorform"><div class="dialoghead"><h2 id="editorTitle">新增監控</h2><button type="button" class="plain" id="close">✕</button></div><div class="two"><label>出發機場 IATA<div class="airport-field"><input name="origin" id="originAirport" placeholder="搜尋 TPE、台北、Taipei…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="originSuggestions" required><div id="originSuggestions" class="airport-suggestions" role="listbox" hidden></div></div></label><label>目的地 IATA<div class="airport-field"><input name="destination" id="destinationAirport" placeholder="搜尋 ICN、首爾、Seoul…" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="destinationSuggestions" required><div id="destinationSuggestions" class="airport-suggestions" role="listbox" hidden></div></div></label></div><div class="two"><label>最早出發<input name="depart_start" type="date" required></label><label>最晚出發<input name="depart_end" type="date" required></label></div><div class="two"><label>最早回程（選填）<input name="return_start" type="date"></label><label>最晚回程（選填）<input name="return_end" type="date"></label></div><p class="hint">固定日期：將最早／最晚設為同一天。彈性日期：填寫日期區間。</p><div class="two"><label>最少停留天數<input name="min_stay" type="number" min="1" max="60" placeholder="選填"></label><label>最多停留天數<input name="max_stay" type="number" min="1" max="60" placeholder="選填"></label></div><fieldset><legend>航空公司</legend><div class="airlines"><label><input type="checkbox" name="airlines" value="JX" checked>星宇</label><label><input type="checkbox" name="airlines" value="CI" checked>華航</label><label><input type="checkbox" name="airlines" value="BR">長榮</label><label><input type="checkbox" name="airlines" value="TR">酷航</label><label><input type="checkbox" name="airlines" value="KE">大韓</label><label><input type="checkbox" name="airlines" value="JL">日航</label></div></fieldset><div class="two"><label>艙等<select name="cabin"><option value="economy">經濟艙</option><option value="premium">豪華經濟艙</option><option value="business">商務艙</option><option value="first">頭等艙</option></select></label><label>目標價格（TWD）<input type="number" name="target_price" min="0" placeholder="選填"></label></div><div class="two"><label>漲價通知門檻（元）<input type="number" name="up_threshold" min="0" value="500" required></label><label>降價通知門檻（元）<input type="number" name="down_threshold" min="0" value="500" required></label></div><div class="checks"><label><input type="checkbox" name="notify_up" checked>漲價通知</label><label><input type="checkbox" name="notify_down" checked>降價通知</label><label><input type="checkbox" name="enabled" checked>啟用監控</label></div><button type="submit" class="full">儲存監控</button><p id="formerror" role="alert"></p></form></dialog></main><script src="./airports.js" defer></script><script src="./app.js" defer></script><script src="./cloud-config.js" defer></script><script src="./cloud.js" defer></script></body></html>
