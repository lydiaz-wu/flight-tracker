<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2ea"><meta name="apple-mobile-web-app-capable" content="yes"><title>Flight Tracker · 航線規劃</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body><header><div class="brand">✈︎ <b>Flight Tracker</b><span>2.0</span></div><nav><button id="export" class="secondary">匯出備份</button><button id="import" class="secondary">匯入備份</button><input id="importfile" type="file" accept="application/json,.json" hidden></nav></header><main><section id="dashboard" hidden><div class="hero"><div><div class="eyebrow">YOUR TRAVEL WATCHLIST</div><h1>每一趟旅程，<br>都有值得等待的價格。</h1><p id="summary">管理所有機票監控與最新變動</p></div><button id="add">＋ 新增航線</button></div><div class="notice"><strong>本機規劃模式</strong>：航線只儲存在這個瀏覽器，不會自動查價、同步到朋友手機或發送票價推播。後續需串接雲端資料庫與查價服務。</div><div id="message" role="status"></div><div class="sectionhead"><h2>追蹤中的航線</h2><span id="count"></span></div><div id="monitors" class="cards"></div><div class="sectionhead"><h2>價格通知</h2></div><div id="alerts" class="alerts"><div class="alert">尚未連接自動查價與 Web Push；不會產生即時通知。</div></div></section><dialog id="editor"><form id="monitorform"><div class="dialoghead"><h2 id="editorTitle">新增監控</h2><button type="button" class="plain" id="close">✕</button></div><div class="two"><label>出發機場 IATA<input name="origin" placeholder="TPE" maxlength="3" required></label><label>目的地 IATA<input name="destination" placeholder="NRT" maxlength="3" required></label></div><div class="two"><label>最早出發<input name="depart_start" type="date" required></label><label>最晚出發<input name="depart_end" type="date" required></label></div><div class="two"><label>最早回程（選填）<input name="return_start" type="date"></label><label>最晚回程（選填）<input name="return_end" type="date"></label></div><p class="hint">固定日期：將最早／最晚設為同一天。彈性日期：填寫日期區間。</p><div class="two"><label>最少停留天數<input name="min_stay" type="number" min="1" max="60" placeholder="選填"></label><label>最多停留天數<input name="max_stay" type="number" min="1" max="60" placeholder="選填"></label></div><fieldset><legend>航空公司</legend><div class="airlines"><label><input type="checkbox" name="airlines" value="JX" checked>星宇</label><label><input type="checkbox" name="airlines" value="CI" checked>華航</label><label><input type="checkbox" name="airlines" value="BR">長榮</label><label><input type="checkbox" name="airlines" value="TR">酷航</label><label><input type="checkbox" name="airlines" value="KE">大韓</label><label><input type="checkbox" name="airlines" value="JL">日航</label></div></fieldset><div class="two"><label>艙等<select name="cabin"><option value="economy">經濟艙</option><option value="premium">豪華經濟艙</option><option value="business">商務艙</option><option value="first">頭等艙</option></select></label><label>目標價格（TWD）<input type="number" name="target_price" min="0" placeholder="選填"></label></div><div class="two"><label>漲價通知門檻（元）<input type="number" name="up_threshold" min="0" value="500" required></label><label>降價通知門檻（元）<input type="number" name="down_threshold" min="0" value="500" required></label></div><div class="checks"><label><input type="checkbox" name="notify_up" checked>漲價通知</label><label><input type="checkbox" name="notify_down" checked>降價通知</label><label><input type="checkbox" name="enabled" checked>啟用監控</label></div><button type="submit" class="full">儲存監控</button><p id="formerror" role="alert"></p></form></dialog></main><script src="./app.js" defer></script></body></html>
